{% extends "base.html" %}
{% block title %}Sign in | JosConnect{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1>
  <form method="post" class="form-stack">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="button button-full" type="submit">Sign in</button>
  </form>
  <p class="form-foot">New here? <a href="{% url 'accounts:signup' 'customer' %}">Create an account</a></p>
</section>
{% endblock %}
